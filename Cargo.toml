[package]
name = "cocoon"
version = "0.5.0"

authors = ["Alexander Fadeev <fadeevab.com@gmail.com>"]
categories = ["cryptography", "no-std", "parser-implementations"]
description = "A simple protected container with strong encryption and format validation."
documentation = "https://docs.rs/cocoon"
edition = "2024"
rust-version = "1.85"
homepage = "https://github.com/fadeevab/cocoon"
keywords = ["encryption", "storage", "keystore", "parser", "container"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/fadeevab/cocoon"

[dependencies]
aes-gcm = {version = "0.11", default-features = false, features = ["aes"]}
chacha20poly1305 = {version = "0.11", default-features = false}
hmac = "0.13"
pbkdf2 = {version = "0.13", default-features = false, features = ["sha2", "hmac"]}
rand = {version = "0.10", default-features = false, features = ["std_rng"]}
sha2 = {version = "0.11", default-features = false}
thiserror = {version = "2.0", optional = true}
zeroize = {version = "1", default-features = false}

[dev-dependencies]
borsh = {version = "1.8", features = ["derive"]}

[features]
# Enables `std` feature by default.
default = ["std"]

# Enables all features, including support of simplified Cocoon API, using `rand::rng`,
# and API related to `std::io`: wrap to writer, unwrap from reader.
std = ["alloc", "rand/thread_rng"]

# Enables `Vec` container. Can be used without `std` crate (in "no std" build).
alloc = ["chacha20poly1305/alloc"]

# Enables support of Cocoon::from_entropy() and MiniCocoon::clone() which get random bytes
# from SysRng (MiniCocoon::clone() is also available with `std`).
getrandom = ["rand/sys_rng"]

# To speed up PBKDF2.
[profile.test]
opt-level = 3

# To speed up PBKDF2.
[profile.dev.package.sha2]
opt-level = 3

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
